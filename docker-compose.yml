version: "3.8"

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure
    networks:
      - webnet
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  app:
    image: trass-automation:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: on-failure
#      resources:
#        limits:
#          cpus: "0.3"
#          memory: "256M"
    networks:
      - webnet

networks:
  webnet: