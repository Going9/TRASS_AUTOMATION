<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>상세조회</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        /* 메인 콘텐츠 영역이 남은 공간을 차지하도록 설정 */
        .main-content {
            flex: 1 0 auto;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar sticky-top bg-body-tertiary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TRASS AUTOMATION</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">TRASS AUTOMATION</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index-form.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="detail-value-form.html">잠정치 조회</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">상세 조회</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- 메인 영역 -->
    <div class="container main-content d-flex flex-column align-items-center justify-content-center">
        <div class="row justify-content-center w-100" id="cardContainer">
            <!-- 템플릿 카드 -->
            <div class="card col-lg-3 col-md-4 mx-4 my-3" style="width: 18rem;" id="inputCardTemplate">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="itemCode" class="form-label">품목코드</label>
                        <input type="text" class="form-control" id="itemCode" placeholder="ex) 901890">
                    </div>
                    <div class="mb-3">
                        <label for="year" class="form-label">연도</label>
                        <input type="text" class="form-control" id="year" placeholder="ex) 2025">
                    </div>
                    <div class="mb-3">
                        <label for="month" class="form-label">월</label>
                        <input type="text" class="form-control" id="month" placeholder="ex) 12">
                    </div>
                    <div class="mb-3">
                        <label for="regions" class="form-label">국내 지역</label>
                        <input type="text" class="form-control" id="regions" placeholder="ex) 금천구">
                    </div>
                </div>
            </div>
        </div>
        <!-- "+" 버튼 -->
        <button type="button" class="btn btn-primary mt-3" id="addCard">품목추가</button>
        <button type="button" class="btn btn-primary mt-3">조회시작</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
    document.getElementById("addCard").addEventListener("click", function() {
        // 템플릿 카드 요소 선택
        let cardTemplate = document.getElementById("inputCardTemplate");

        // 카드 복제 (깊은 복제)
        let newCard = cardTemplate.cloneNode(true);

        // 중복되는 id 제거
        newCard.removeAttribute("id");

        // 복제된 카드 내부의 모든 input 값 초기화
        newCard.querySelectorAll("input").forEach(function(input) {
            input.value = "";
        });

        // 새로운 카드 추가
        document.getElementById("cardContainer").appendChild(newCard);
    });
</script>
</body>
</html>
