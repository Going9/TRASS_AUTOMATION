<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail Value List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>상세조회 결과</h1>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>품목코드</th>
            <th>연도</th>
            <th>월</th>
            <th>국내 지역 / 달러</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detail : ${detailValueOfTwoItemsResponseWrapper.detailValueOfTwoItemsResponseList}">
            <td th:text="${detail.itemCode}">품목코드</td>
            <td th:text="${detail.year}">연도</td>
            <td th:text="${detail.month}">월</td>
            <td>
                <span th:text="${detail.domesticRegionDollars.domesticRegion}">국내 지역</span>
                /
                <span th:text="${detail.domesticRegionDollars.dollar}">달러</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
